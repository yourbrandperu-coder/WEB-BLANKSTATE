    :root {

      --white:   #F6F6F6;
      --g1:      #EBEBEB;
      --g2:      #D0D0D0;
      --g3:      #A0A0A0;
      --g4:      #505050;
      --g5:      #1E1E1E;

    body {

      background: var(--white);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;

    /* ── CURSOR ── */
    .cursor {
      width: 8px; height: 8px;
      background: var(--black);
      border-radius: 50%;
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.15s var(--ease), width 0.3s, height 0.3s, background 0.3s;
      transform: translate(-50%, -50%);
    }
    .cursor.grow {
      width: 36px; height: 36px;
      background: transparent;
      border: 1.5px solid var(--black);
    }

    /* ── ANNOUNCEMENT BAR ── */
    .bar {
      background: var(--black);
      color: var(--white);
      text-align: center;
      padding: 9px 20px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* ── NAV ── */

      background: var(--white);
      border-bottom: 1px solid var(--g2);

      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      height: 64px;

    .nav-logo { display: flex; align-items: center; text-decoration: none; }
    .nav-logo-wordmark {

      font-weight: 300;

    .nav-logo-wordmark sup { font-size: 9px; vertical-align: super; letter-spacing: 0; }

      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 400;
      color: var(--g4);
      text-decoration: none;
      transition: color 0.2s;

    .nav-links a:hover { color: var(--black); }
    .nav-cta {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--black); color: var(--white);
      text-decoration: none;
      padding: 10px 22px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      transition: background 0.2s, transform 0.2s;
    }
    .nav-cta:hover { background: var(--g5); transform: translateY(-1px); }

    /* ── BREADCRUMB ── */
    .breadcrumb {
      padding: 18px 48px;
      border-bottom: 1px solid var(--g1);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .breadcrumb a {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--g3);
      text-decoration: none;
      transition: color 0.2s;
    }
    .breadcrumb a:hover { color: var(--black); }
    .breadcrumb-sep { font-size: 11px; color: var(--g2); }
    .breadcrumb-current {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--g4);
    }

    /* ── PRODUCT LAYOUT ── */
    .product-page {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
    }

    /* ── VISUAL PANEL ── */

      position: sticky;
      top: 64px;
      align-self: start;
      height: calc(100vh - 64px);
      background: var(--g5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* No-photo: color background */

      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.5s var(--ease);
      position: relative;
      overflow: hidden;
    }
    .visual-pack-num {

      font-weight: 300;
      color: rgba(255,255,255,0.06);
      letter-spacing: -0.04em;
      line-height: 1;
      user-select: none;
      position: absolute;
    }

    /* Color bar overlay */

      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 64px 32px 24px;
      background: linear-gradient(to top, rgba(8,8,8,0.55), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
      pointer-events: none;
    }
    .visual-color-bar-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    .visual-color-name {
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
    }
    .visual-color-dots { display: flex; gap: 9px; pointer-events: auto; }
    .visual-color-dot {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
      padding: 0;
    }
    .visual-color-dot.active { border-color: white; transform: scale(1.18); }
    .visual-colors-count {
      font-size: 9.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      font-weight: 300;
    }

      flex: 1;
      position: relative;
      overflow: hidden;

      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .gallery-img.active { opacity: 1; }

    /* Thumbs strip */

      background: var(--black);
      flex-shrink: 0;

</head>

  // ── CURSOR ──
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });
  function attachCursor(el) {
    el.addEventListener('mouseenter', () => cursor.classList.add('grow'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('grow'));
  }

  // ── NAV SCROLL ──
  window.addEventListener('scroll', () => {
    document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 60);
  });

  // ── SYNC COLOR BETWEEN VISUAL AND INFO ──
  let currentColorIdx = 0;
  let currentPack = null;

  function syncColor(ci) {
    currentColorIdx = ci;
    const items = currentPack.colors || currentPack.swatches;
    const name = items[ci].name;

    // Visual dots
    document.querySelectorAll('.visual-color-dot').forEach((d, i) => d.classList.toggle('active', i === ci));
    const vcn = document.getElementById('visual-color-name');
    if (vcn) vcn.textContent = name;

    // Info dots
    document.querySelectorAll('.info-color-dot').forEach((d, i) => d.classList.toggle('active', i === ci));
    const icn = document.getElementById('info-color-name');
    if (icn) icn.textContent = name;
  }

  // ── RENDER VISUAL — WITH PHOTOS ──
  function renderVisualPhotos(pack) {
    const el = document.getElementById('product-visual');
    let html = '<div class="visual-gallery">';
    pack.colors.forEach((color, ci) => {
      color.photos.forEach((src, pi) => {
        html += `<img class="gallery-img${ci===0 && pi===0 ? ' active' : ''}"
          src="${src}" alt="Pack ${pack.num} ${color.name} ${pi+1}"
          data-color="${ci}" data-photo="${pi}" />`;
      });
    });
    html += '</div>';

    // Color bar
    html += `<div class="visual-color-bar">
      <span class="visual-color-name" id="visual-color-name">${pack.colors[0].name}</span>
      <div class="visual-color-dots">`;
    pack.colors.forEach((c, ci) => {
      html += `<button class="visual-color-dot${ci===0?' active':''}"
        style="background:${c.hex}" data-color="${ci}" aria-label="${c.name}"></button>`;
    });
    html += '</div></div>';

    // Thumbs
    html += '<div class="visual-thumbs" id="visual-thumbs">';
    pack.colors[0].photos.forEach((src, pi) => {
      html += `<div class="visual-thumb${pi===0?' active':''}" data-color="0" data-photo="${pi}">
        <img src="${src}" alt="Foto ${pi+1}" /></div>`;
    });
    html += '</div>';

    el.innerHTML = html;

    function showPhoto(ci, pi) {
      el.querySelectorAll('.gallery-img').forEach(img => img.classList.remove('active'));
      const target = el.querySelector(`.gallery-img[data-color="${ci}"][data-photo="${pi}"]`);
      if (target) target.classList.add('active');
      el.querySelectorAll('.visual-thumb').forEach((th, i) => th.classList.toggle('active', i === pi));
    }

    function rebuildThumbs(ci) {
      const thumbsEl = document.getElementById('visual-thumbs');
      thumbsEl.innerHTML = '';
      pack.colors[ci].photos.forEach((src, pi) => {
        const th = document.createElement('div');
        th.className = 'visual-thumb' + (pi === 0 ? ' active' : '');
        th.dataset.color = ci;
        th.dataset.photo = pi;
        th.innerHTML = `<img src="${src}" alt="Foto ${pi+1}" />`;
        th.addEventListener('click', () => showPhoto(ci, pi));
        attachCursor(th);
        thumbsEl.appendChild(th);
      });
    }

    el.querySelectorAll('.visual-color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        const ci = parseInt(dot.dataset.color);
        syncColor(ci);
        rebuildThumbs(ci);
        showPhoto(ci, 0);
      });
    });

    el.querySelectorAll('.visual-thumb').forEach(th => {
      th.addEventListener('click', () => showPhoto(parseInt(th.dataset.color), parseInt(th.dataset.photo)));
    });

    // Touch swipe for gallery
    const galleryEl = el.querySelector('.visual-gallery');
    if (galleryEl) {
      let tsX = 0, tsY = 0;
      galleryEl.addEventListener('touchstart', e => {
        tsX = e.touches[0].clientX;
        tsY = e.touches[0].clientY;
      }, { passive: true });
      galleryEl.addEventListener('touchend', e => {
        const dx = tsX - e.changedTouches[0].clientX;
        const dy = Math.abs(tsY - e.changedTouches[0].clientY);
        if (Math.abs(dx) > 40 && dy < 80) {
          const activeImg = el.querySelector('.gallery-img.active');
          if (!activeImg) return;
          const ci = parseInt(activeImg.dataset.color);
          const pi = parseInt(activeImg.dataset.photo);
          const total = pack.colors[ci].photos.length;
          showPhoto(ci, dx > 0 ? (pi + 1) % total : (pi - 1 + total) % total);
        }
      }, { passive: true });
    }
  }

  // ── RENDER VISUAL — COLOR BACKGROUND ──
  function renderVisualColor(pack) {
    const el = document.getElementById('product-visual');
    const first = pack.swatches[0];

    el.innerHTML = `
      <div class="visual-color-bg" id="visual-bg" style="background:${first.hex}">
        <span class="visual-pack-num">${pack.num}</span>
      </div>
      <div class="visual-color-bar">
        <div>
          <span class="visual-color-name" id="visual-color-name">${first.name}</span><br>
          <span class="visual-colors-count">${pack.swatches.length} colores disponibles</span>
        </div>
        <div class="visual-color-dots">
          ${pack.swatches.map((s, i) =>
            `<button class="visual-color-dot${i===0?' active':''}"
              style="background:${s.hex}" data-color="${i}" aria-label="${s.name}" title="${s.name}"></button>`
          ).join('')}
        </div>
      </div>`;

    const bg = document.getElementById('visual-bg');
    el.querySelectorAll('.visual-color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        const ci = parseInt(dot.dataset.color);
        bg.style.background = pack.swatches[ci].hex;
        syncColor(ci);
      });
    });
  }

  // ── RENDER INFO ──
  function renderInfo(pack) {
    const el = document.getElementById('product-info');
    const tagLine = pack.badge ? `Pack ${pack.num} &nbsp;·&nbsp; ${pack.badge}` : `Pack ${pack.num}`;
    const colorItems = pack.colors || pack.swatches;

    let colorsSection = '';
    if (colorItems) {
      const firstName = colorItems[0].name;
      colorsSection += `<p class="info-colors-label">Colores disponibles</p>
        <div class="info-colors-row">
          ${colorItems.map((c, i) =>
            `<button class="info-color-dot${i===0?' active':''}"
              style="background:${c.hex}" data-color="${i}" aria-label="${c.name}"></button>`
          ).join('')}
          <span class="info-color-name" id="info-color-name">${firstName}</span>
        </div>`;
    }
    if (pack.colorsNote) {
      colorsSection += `<p class="info-colors-note">${pack.colorsNote}</p>`;
    }

    el.innerHTML = `
      <p class="info-tag">${tagLine}</p>
      <h1 class="info-title">${pack.name}</h1>
      <div class="info-price-row">
        <span class="info-price">${pack.price}</span>
        <span class="info-qty">${pack.qty}</span>
      </div>
      <div class="info-divider"></div>
      <p class="info-desc">${pack.desc}</p>
      ${colorsSection}
      <div class="info-spacer"></div>
      <a href="${pack.wsp}" class="info-cta" target="_blank" rel="noopener">
        Pedir por WhatsApp
        <svg class="info-cta-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 1.41.37 2.74 1.01 3.89L0 16l4.28-1.12A7.96 7.96 0 008 16c4.42 0 8-3.58 8-8s-3.58-8-8-8zm3.93 11.07c-.17.48-.98.93-1.36.99-.35.05-.79.07-1.27-.08a11.5 11.5 0 01-1.15-.43C6.64 10.8 5.5 9.4 5.41 9.29c-.09-.11-.73-.97-.73-1.85 0-.88.46-1.31.62-1.49.17-.18.37-.22.49-.22h.35c.11 0 .27-.04.42.32l.54 1.35c.05.11.08.24.02.38l-.2.39-.3.31c-.1.1-.2.21-.09.41.11.2.5.82 1.07 1.33.73.65 1.35.85 1.54.94.19.09.3.08.41-.05l.49-.58c.14-.18.28-.15.47-.09l1.33.63c.19.09.31.14.36.22.04.08.04.46-.13.93z" fill="currentColor"/>
        </svg>
      </a>`;

    // Info color dots → sync visual
    el.querySelectorAll('.info-color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        const ci = parseInt(dot.dataset.color);
        const vDot = document.querySelector(`#product-visual .visual-color-dot[data-color="${ci}"]`);
        if (vDot) vDot.click();
        else syncColor(ci);
      });
    });
  }

  // ── MAIN RENDER ──
  function render() {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('id') || '';
    const id = raw.padStart(2, '0');
    const pack = PACKS[id];

    if (!pack) {
      document.getElementById('product-page').innerHTML = `
        <div class="not-found">
          <h1>404</h1>
          <a href="index.html">← Volver al catálogo</a>
        </div>`;
      return;
    }

    currentPack = pack;
    document.getElementById('page-title').textContent = `Blankstate — Pack ${pack.num}`;
    document.getElementById('breadcrumb-current').textContent = `Pack ${pack.num}`;
    const ogTitle = document.getElementById('og-title');
    if (ogTitle) ogTitle.content = `Blankstate — Pack ${pack.num}: ${pack.name.replace(/<br>/g, ' ')}`;

    const waFloat = document.getElementById('wa-float');
    if (waFloat) waFloat.href = pack.wsp;

    if (pack.colors) {
      renderVisualPhotos(pack);
    } else {
      renderVisualColor(pack);
    }
    renderInfo(pack);

    document.querySelectorAll('a, button').forEach(attachCursor);
  }

  render();
</script>
